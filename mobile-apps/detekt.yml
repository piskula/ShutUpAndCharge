config:
  warningsAsErrors: false

comments:
  active: true

complexity:
  active: true
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    active: true
    ignorePrivate: true
    ignoreAnnotatedFunctions: ['Preview']

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false

performance:
  active: true

coroutines:
  active: true

empty-blocks:
  active: true

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  NewLineAtEndOfFile:
    active: false

exceptions:
  active: true
  TooGenericExceptionThrown:
    active: true
    severity: warning
  NotImplementedDeclaration:
    active: true
    severity: warning

potential-bugs:
  active: true
  CastNullableToNonNullableType:
    active: true
    severity: error
  CastToNullableType:
    active: true
    severity: error
  DontDowncastCollectionTypes:
    active: true
    severity: error
  NullCheckOnMutableProperty:
    active: true
    severity: error
  UnconditionalJumpStatementInLoop:
    active: true
    severity: error
